name: Video Studio CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-studio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg espeak-ng

      - name: Type-check and unit-test
        run: |
          npm run typecheck
          npm test

      - name: Install Remotion render browser
        run: npx remotion browser ensure

      - name: Render one still and validate pixels
        run: |
          npm run still
          npm run check:image -- out/preview.png --expect=1920x1080

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps --only-shell chromium

      - name: Test the Player in Chromium
        run: npm run test:browser

      - name: Smoke-test FFmpeg sound synthesis
        run: |
          npm run audio:sfx
          npm run check:audio -- out/sfx/chime.wav

      - name: Smoke-test Turkish draft TTS
        run: |
          npm run tts:espeak -- "İstanbul'da görsel bir hikâye başlıyor." out/audio/tts-smoke.wav
          npm run check:audio -- out/audio/tts-smoke.wav

      - name: Upload QA previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-studio-ci-${{ github.run_number }}
          path: |
            out/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
